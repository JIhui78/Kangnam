
<!DOCTYPE html>
<html lang='ko'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>KNU 알리미 - Ultimate Fixed v10</title>
    <link href='https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap' rel='stylesheet'>
    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0'></script>
    <style>
        :root {
            --primary: #003a78; --accent: #ffb800; --bg: #f8f9fa; --card: #ffffff; --text: #1d1d1f;
            --radius: 16px; --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-top: 70px; }
        header { background: var(--primary); color: #fff; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; position: fixed; top: 0; width: 100%; z-index: 1000; }
        .top-nav { display: flex; gap: 20px; }
        .top-nav-item { cursor: pointer; opacity: 0.8; font-weight: 600; padding: 10px; }
        .top-nav-item.active { opacity: 1; border-bottom: 3px solid var(--accent); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card { background: var(--card); border-radius: var(--radius); padding: 25px; margin-bottom: 20px; box-shadow: var(--shadow); }
        .hidden { display: none !important; }
        .btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-accent { background: var(--accent); color: var(--primary); }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; background: #eee; border: 3px solid var(--accent); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-header { text-align: center; font-size: 12px; font-weight: bold; padding: 5px; background: #eee; border-radius: 4px; }
        .cal-day { min-height: 85px; background: #fff; border: 1px solid #eee; padding: 5px; border-radius: 8px; position: relative; font-size: 12px; display: flex; flex-direction: column; }
        .cal-day b { margin-bottom: 2px; }
        .cal-day-name { font-size: 10px; color: #888; }
        .cal-time-badge { font-size: 13px; color: #ff4d4d; font-weight: 800; margin: auto 0; text-align: center; }
        .schedule-tag { font-size: 10px; padding: 2px 4px; border-radius: 4px; color: white; margin-top: 2px; cursor: display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
        .summary-box { display: flex; justify-content: space-around; background: #f0f4f8; padding: 15px; border-radius: 12px; margin-top: 15px; }
        .summary-item { text-align: center; }
        .summary-val { display: block; font-size: 18px; font-weight: 800; color: var(--primary); }
        .summary-lab { font-size: 12px; color: #666; }
        .arrow-btn { background: none; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; padding: 2px 8px; font-size: 14px; }
        .rank-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .cat-item { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin: 2px; color: white; cursor: pointer; }
        input, select, textarea { padding: 10px; border: 1px solid #ddd; border-radius: 8px; width: 100%; margin-bottom: 10px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:2000; }
        .modal-content { background:#fff; padding:30px; border-radius:var(--radius); width:95%; max-width:500px; max-height: 80vh; overflow-y: auto; }
        .weather-box { background: linear-gradient(135deg, #003a78, #0056b3); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .post-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .post-item:hover { background: #f9f9f9; }
        .comment-item { padding: 8px; background: #f5f5f5; border-radius: 8px; margin-top: 5px; font-size: 13px; }
        .anon-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
        .anon-wrap input { width: auto; margin: 0; }
    </style>
</head>
<body>
    <div id='auth-section'>
        <div class='card' style='width:400px; margin:100px auto;'>
            <h2 id='auth-title' style='text-align:center'>KNU 알리미 로그인</h2>
            <input type='text' id='user-id' placeholder='학번'>
            <input type='password' id='user-pw' placeholder='비밀번호'>
            <div id='signup-fields' class='hidden'>
                <input type='text' id='user-name' placeholder='이름'>
                <select id='user-dept-signup'></select>
            </div>
            <button class='btn btn-primary' id='main-auth-btn' onclick='handleAuth()' style='width:100%'>로그인</button>
            <p style='text-align:center; cursor:pointer; color:#666; margin-top:15px' onclick='toggleAuthMode()' id='auth-toggle-text'>회원가입이 필요하신가요?</p>
        </div>
    </div>

    <div id='main-app' class='hidden'>
        <header>
            <div style='display:flex; align-items:center; gap:20px'>
                <span style='font-size:20px; font-weight:800'>KNU 알리미</span>
                <nav class='top-nav'>
                    <div class='top-nav-item' id='nav-home' onclick='showPage("home")'>홈</div>
                    <div class='top-nav-item' id='nav-study' onclick='showPage("study")'>학습관리</div>
                    <div class='top-nav-item' id='nav-schedule' onclick='showPage("schedule")'>일정관리</div>
                    <div class='top-nav-item' id='nav-community' onclick='showPage("community")'>커뮤니티</div>
                </nav>
            </div>
            <button class='btn btn-accent' onclick='logout()'>로그아웃</button>
        </header>

        <div class='container'>
            <section id='page-home'>
                <div style='display:grid; grid-template-columns: 350px 1fr; gap:25px'>
                    <div class='card'>
                        <div style='text-align:center'>
                            <img src='' id='display-profile-img' class='profile-img'>
                            <h3 id='display-name' style='margin:10px 0 5px 0'></h3>
                            <p id='display-dept' style='color:var(--primary); font-weight:bold; margin:0'></p>
                            <p id='display-msg' style='color:#666; font-size:14px; margin-bottom:15px'></p>
                            <button class='btn btn-primary' onclick='openProfileModal()' style='width:100%'>프로필 수정</button>
                        </div>
                        <div class='summary-box'>
                            <div class='summary-item'><span class='summary-lab'>오늘 공부</span><span class='summary-val' id='home-today-time'>0m</span></div>
                            <div class='summary-item'><span class='summary-lab'>전체 랭킹</span><span class='summary-val' id='home-total-rank'>-</span></div>
                            <div class='summary-item'><span class='summary-lab'>학과 랭킹</span><span class='summary-val' id='home-dept-rank'>-</span></div>
                        </div>
                    </div>
                    <div>
                        <div class='card'>
                            <h3>🚀 바로가기</h3>
                            <div style='display:flex; gap:10px'>
                                <a href='https://www.kangnam.ac.kr' target='_blank' style='flex:1; background:#eee; padding:15px; border-radius:12px; text-align:center; text-decoration:none; color:var(--primary); font-weight:700'>학교 홈</a>
                                <a href='https://sugang.kangnam.ac.kr' target='_blank' style='flex:1; background:#eee; padding:15px; border-radius:12px; text-align:center; text-decoration:none; color:var(--primary); font-weight:700'>수강신청</a>
                                <a href='#' id='dept-link' target='_blank' style='flex:1; background:#eee; padding:15px; border-radius:12px; text-align:center; text-decoration:none; color:var(--primary); font-weight:700'>학과 홈</a>
                            </div>
                        </div>
                        <div style='display:grid; grid-template-columns: 1fr 1fr; gap:20px'>
                            <div class='card'>
                                <h3>📅 주요 일정 (D-Day)</h3>
                                <div id='home-upcoming-list'></div>
                            </div>
                            <div class='card'>
                                <h3>📣 최신 커뮤니티 글</h3>
                                <div id='home-community-preview' style='margin-top:10px'></div>
                                <button class='btn btn-primary' onclick='showPage("community")' style='width:100%; margin-top:10px; font-size:12px;'>전체보기</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id='page-community' class='hidden'>
                <div class='card'>
                    <div style='display:flex; justify-content:space-between; align-items:center; margin-bottom:20px'>
                        <h2>🏫 KNU 광장</h2>
                        <div style='display:flex; gap:10px'>
                             <input type='text' id='search-input' placeholder='키워드 검색...' style='margin:0; width:200px' onkeyup='if(window.event.keyCode==13){renderCommunity()}'>
                             <button class='btn btn-primary' onclick='openPostModal()'>글쓰기</button>
                        </div>
                    </div>
                    <div style='display:flex; gap:10px; margin-bottom:20px; overflow-x:auto; padding-bottom:5px'>
                        <button class='btn' onclick='filterCommunity("all")' id='btn-cat-all'>전체</button>
                        <button class='btn' onclick='filterCommunity("자유")'>자유</button>
                        <button class='btn' onclick='filterCommunity("공부")'>공부</button>
                        <button class='btn' onclick='filterCommunity("장터")'>장터</button>
                        <button class='btn' onclick='filterCommunity("홍보")'>홍보</button>
                        <button class='btn' onclick='filterCommunity("동아리")'>동아리</button>
                    </div>
                    <div id='community-post-list'></div>
                </div>
            </section>

            <section id='page-study' class='hidden'>
                <div style='display:grid; grid-template-columns: 1fr 380px; gap:25px'>
                    <div>
                        <div class='card' style='text-align:center'>
                            <h1 id='timer-display' style='font-size:48px'>00:00:00</h1>
                            <button class='btn btn-primary' id='timer-btn' onclick='toggleTimer()'>학습 시작</button>
                        </div>
                        <div class='card'>
                            <div style='display:flex; justify-content:space-between; align-items:center'>
                                <h3>📊 주간 학습 통계 (월-일)</h3>
                                <div>
                                    <button class='arrow-btn' onclick='changeWeek(-1)'>◀</button>
                                    <button class='arrow-btn' onclick='changeWeek(1)'>▶</button>
                                </div>
                            </div>
                            <div style='height:180px; margin-top:10px'><canvas id='stats-chart'></canvas></div>
                        </div>
                        <div class='card'>
                            <div style='display:flex; justify-content:space-between; align-items:center'>
                                <h3>📅 <span id='mini-cal-month-label'></span> 학습 캘린더</h3>
                                <div>
                                    <button class='arrow-btn' onclick='changeMonth(-1)'>◀</button>
                                    <button class='arrow-btn' onclick='changeMonth(1)'>▶</button>
                                </div>
                            </div>
                            <div class='calendar-grid' id='study-mini-calendar'></div>
                        </div>
                    </div>
                    <div class='card'>
                        <div style='display:flex; justify-content:space-between; align-items:center'>
                            <h3>🏆 실시간 랭킹</h3>
                            <select id='rank-filter' onchange='renderRanking()' style='width:auto; margin:0;'>
                                <option value='all'>전체</option>
                                <option value='dept'>내 학과</option>
                            </select>
                        </div>
                        <div id='ranking-list'></div>
                    </div>
                </div>
            </section>

            <section id='page-schedule' class='hidden'>
                <div class='card'>
                    <h3>🗓 일정 등록</h3>
                    <div style='display:flex; gap:10px; margin-bottom:15px'>
                        <input type='date' id='event-date'>
                        <select id='event-cat' style='font-weight:bold;'></select>
                        <input type='text' id='event-title' placeholder='할 일 입력'>
                        <button class='btn btn-primary' onclick='addEvent()'>등록</button>
                    </div>
                    <div style='background:#f9f9f9; padding:15px; border-radius:12px; margin-bottom:20px'>
                        <h4 style='margin-top:0'>🏷 카테고리 관리</h4>
                        <div style='display:flex; gap:10px; margin-bottom:10px'>
                            <input type='text' id='new-cat-name' placeholder='새 카테고리명' style='margin:0'>
                            <input type='color' id='new-cat-color' value='#003a78' style='width:60px; padding:2px; margin:0; height:40px;'>
                            <button class='btn btn-primary' onclick='addCat()'>추가</button>
                        </div>
                        <div id='cat-list-display'></div>
                        <p style='font-size:11px; color:#888; margin:5px 0 0 0'>* 카테고리를 <b>더블 클릭</b>하면 삭제됩니다.</p>
                    </div>
                    <p style='font-size:12px; color:#888;'>* 일정은 <b>더블 클릭</b> 시 삭제됩니다.</p>
                    <div class='calendar-grid' id='calendar-body'></div>
                </div>
            </section>
        </div>
    </div>

    <!-- 커뮤니티 글쓰기 모달 -->
    <div id='post-modal' class='modal hidden'>
        <div class='modal-content'>
            <h3 style='margin-top:0'>새 글 작성</h3>
            <select id='post-cat'>
                <option value='자유'>자유게시판</option>
                <option value='공부'>공부게시판</option>
                <option value='장터'>장터게시판</option>
                <option value='홍보'>홍보게시판</option>
                <option value='동아리'>동아리게시판</option>
            </select>
            <input type='text' id='post-title' placeholder='제목 (최대 20자)'>
            <textarea id='post-content' placeholder='내용을 입력하세요' style='height:150px; resize:none;'></textarea>
            <label class='anon-wrap'><input type='checkbox' id='post-anon'> 익명으로 작성</label>
            <div style='display:flex; gap:10px'>
                <button class='btn btn-primary' onclick='savePost()' style='flex:1'>등록</button>
                <button class='btn' onclick='closePostModal()' style='flex:1; background:#eee'>취소</button>
            </div>
        </div>
    </div>

    <!-- 게시글 상세보기 모달 -->
    <div id='post-view-modal' class='modal hidden'>
        <div class='modal-content'>
            <div id='post-detail-content'></div>
            <hr>
            <h4>댓글</h4>
            <div id='comment-list'></div>
            <div style='margin-top:10px'>
                <label class='anon-wrap'><input type='checkbox' id='comment-anon'> 익명으로 작성</label>
                <div style='display:flex; gap:5px'>
                    <input type='text' id='comment-input' placeholder='댓글을 입력하세요' style='margin:0'>
                    <button class='btn btn-primary' onclick='saveComment()'>등록</button>
                </div>
            </div>
            <button class='btn' onclick='closePostViewModal()' style='width:100%; margin-top:15px; background:#eee'>닫기</button>
        </div>
    </div>

    <div id='rank-modal' class='modal hidden'>
        <div class='modal-content' style='text-align:center'>
            <img id='rank-p-img' class='profile-img' style='margin-bottom:15px'>
            <h3 id='rank-p-name' style='margin:0'></h3>
            <p id='rank-p-dept' style='color:var(--primary); font-weight:700; margin:5px 0'></p>
            <p id='rank-p-msg' style='color:#666; font-size:14px; margin-bottom:20px'></p>
            <button class='btn btn-primary' onclick='closeRankModal()' style='width:100%'>닫기</button>
        </div>
    </div>

    <div id='profile-modal' class='modal hidden'>
        <div class='modal-content'>
            <h3 style='margin-top:0'>프로필 수정</h3>
            <label>학과:</label><select id='edit-dept'></select>
            <label>한마디:</label><input type='text' id='edit-msg'>
            <label>사진 변경:</label><input type='file' accept='image/*' onchange='previewImage(this)'>
            <div style='display:flex; gap:10px; margin-top:20px'>
                <button class='btn btn-primary' onclick='saveProfile()' style='flex:1'>저장</button>
                <button class='btn' onclick='closeProfileModal()' style='flex:1; background:#eee'>취소</button>
            </div>
        </div>
    </div>

    <script>
        const departments = [
            "자유전공학부", "사회복지학부", "시니어비즈니스학과", "상경학부", "법행정세무학부", "문화콘텐츠학과",
            "국제지역학과", "중국콘텐츠비즈니스학과", "기독교커뮤니케이션학과", "한국어문학과", "컴퓨터공학부", "인공지능융합공학부",
            "전자반도체공학부", "부동산건설학부", "디자인학과", "체육학과", "음악학과", "교육학과",
            "유아교육과", "초등특수교육과", "중등특수교육과"
        ];
        const dayNames = ['일','월','화','수','목','금','토'];

        let currentUser = null; let timerIdx = null; let statsChart = null; let tempImgData = null;
        let currentWeekOffset = 0; let currentMonthDate = new Date();
        let currentPostId = null; let currentCommunityCat = 'all';
        // localStorage 사용 제거: const storage = { get: (k) => JSON.parse(localStorage.getItem(k) || '[]'), set: (k, v) => localStorage.setItem(k, JSON.stringify(v)) };

        function getLocalYYYYMMDD(date) {
            const d = date || new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        window.onload = () => {
            const deptHtml = departments.map(d => `<option value='${d}'>${d}</option>`).join('');
            document.getElementById('user-dept-signup').innerHTML = deptHtml;
            document.getElementById('edit-dept').innerHTML = deptHtml;
            // 페이지 로드 시 로그인 상태 확인 (백엔드와 연동)
            // 실제 환경에서는 쿠키나 JWT 토큰 등을 확인하여 자동 로그인 처리
            // 여기서는 단순화를 위해 로그인 페이지로 시작
        };

        function toggleAuthMode() {
            const isSignup = document.getElementById('signup-fields').classList.toggle('hidden');
            document.getElementById('auth-title').innerText = isSignup ? 'KNU 알리미 회원가입' : 'KNU 알리미 로그인';
            document.getElementById('main-auth-btn').innerText = isSignup ? '가입하기' : '로그인';
            document.getElementById('auth-toggle-text').innerText = isSignup ? '이미 계정이 있으신가요?' : '회원가입이 필요하신가요?';
        }

        async function handleAuth() {
            console.log('handleAuth called');
            const id = document.getElementById('user-id').value;
            const pw = document.getElementById('user-pw').value;
            const isSignup = !document.getElementById('signup-fields').classList.contains('hidden');

            if (isSignup) {
                const name = document.getElementById('user-name').value;
                const dept = document.getElementById('user-dept-signup').value;
                if (!id || !pw || !name || !dept) {
                    alert('모든 정보를 입력해주세요!');
                    return;
                }
                try {
                    const response = await fetch('/users/signup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, pw, name, dept })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert('가입 성공!');
                        toggleAuthMode(); // 회원가입 후 로그인 모드로 전환
                        document.getElementById('user-id').value = id;
                        document.getElementById('user-pw').value = pw;
                    } else {
                        alert('회원가입 실패: ' + (data.detail || '알 수 없는 오류'));
                    }
                } catch (error) {
                    console.error('Error during signup:', error);
                    alert('회원가입 중 오류가 발생했습니다.');
                }
            } else { // 로그인
                if (!id || !pw) {
                    alert('학번과 비밀번호를 입력해주세요!');
                    return;
                }
                try {
                    const response = await fetch('/users/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, pw })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        // 로그인 성공 시 사용자 정보 저장
                        currentUser = data.user; // 백엔드에서 받은 사용자 정보
                        loginSuccess();
                        console.log('Login successful');
                    } else {
                        alert('로그인 실패: ' + (data.detail || '학번 또는 비밀번호가 틀립니다!'));
                    }
                } catch (error) {
                    console.error('Error during login:', error);
                    alert('로그인 중 오류가 발생했습니다.');
                }
            }
        }

        function loginSuccess() {
            console.log('loginSuccess called');
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            updateProfileUI(); showPage('home');
            console.log('Main app visibility updated');
        }

        function updateProfileUI() {
            // currentUser가 null이 아니라고 가정 (로그인 성공 후 호출)

        async function renderStudy() {
            // TODO: 백엔드 API에서 주간 학습 통계 가져오도록 수정 필요
            const ctx = document.getElementById('stats-chart').getContext('2d');
            const labels = []; const data = [];

            const today = new Date();
            const dayOfWeek = today.getDay();
            const diffToMonday = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek) + (currentWeekOffset * 7);

            for(let i=0; i<7; i++) {
                const d = new Date(); d.setHours(0,0,0,0);
                d.setDate(today.getDate() + diffToMonday + i);
                const ds = getLocalYYYYMMDD(d);
                labels.push(`${ds.substr(5,5)} (${dayNames[d.getDay()]})`);
                data.push(0); // 임시 데이터
            }

            if(statsChart) statsChart.destroy();
            statsChart = new Chart(ctx, {
                type: 'bar', plugins: [ChartDataLabels],
                data: { labels, datasets:[{ data, backgroundColor: '#003a78' }] },
                options: {
                    maintainAspectRatio: false,
                    scales: {
                        y: { display: false, beginAtZero: true, suggestedMax: 60, grace: '10%' },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    },
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            anchor: 'end', align: 'top', offset: 0, font: { weight: 'bold', size: 10 },
                            formatter: (v) => v > 0 ? (v >= 60 ? `${Math.floor(v/60)}h ${v%60}m` : `${v}m`) : ''
                        }
                    }
                }
            });
        }
